<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>VE5 — 账户总览</title>
<style>
:root {
  --bg-deep: #050a14; --bg-surface: #0b1321; --bg-elevated: #111d2e;
  --bg-glass: rgba(17,29,46,0.75);
  --text-primary: #e2e8f0; --text-secondary: #94a3b8; --text-muted: #64748b;
  --accent-indigo: #6366f1; --accent-cyan: #22d3ee; --accent-emerald: #34d399;
  --accent-amber: #f59e0b; --accent-rose: #f43f5e; --accent-violet: #a78bfa;
  --success: #22c55e; --warning: #f59e0b;
  --border-subtle: rgba(148,163,184,0.1);
  --border-active: rgba(99,102,241,0.3);
  --shadow-elevated: 0 16px 48px rgba(0,0,0,0.4);
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
  --mono: 'JetBrains Mono', 'Consolas', 'SF Mono', monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg-deep); color: var(--text-primary);
  min-height: 100vh;
}
.header {
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  padding: 0 32px; height: 60px;
  display: flex; align-items: center; justify-content: space-between;
}
.header-left { display: flex; align-items: center; gap: 16px; }
.brand-mark {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent-indigo), var(--accent-cyan));
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 14px; color: #fff;
  position: relative; overflow: hidden;
}
.brand-mark::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.25), transparent 60%);
}
.header-title { font-size: 15px; font-weight: 700; }
.header-back {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: var(--radius-sm);
  background: rgba(99,102,241,0.08); color: var(--accent-indigo);
  font-size: 13px; font-weight: 600; cursor: pointer; border: none;
  transition: background 0.2s;
}
.header-back:hover { background: rgba(99,102,241,0.15); }

/* 统计栏 */
.stats-bar {
  display: flex; gap: 20px; padding: 20px 32px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
}
.stat-card {
  padding: 12px 20px; border-radius: var(--radius-sm);
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
}
.stat-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
.stat-value { font-size: 22px; font-weight: 700; font-family: var(--mono); }
.stat-value.cyan { color: var(--accent-cyan); }
.stat-value.indigo { color: var(--accent-indigo); }
.stat-value.emerald { color: var(--accent-emerald); }

/* 筛选栏 */
.filter-bar {
  display: flex; gap: 8px; padding: 16px 32px;
  flex-wrap: wrap;
}
.filter-btn {
  padding: 6px 16px; border-radius: 20px;
  border: 1px solid var(--border-subtle);
  background: transparent; color: var(--text-secondary);
  font-size: 12px; cursor: pointer; transition: all 0.2s;
}
.filter-btn:hover { border-color: var(--accent-indigo); color: var(--text-primary); }
.filter-btn.active {
  background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(34,211,238,0.08));
  border-color: var(--accent-indigo); color: var(--accent-cyan);
}

/* 表格 */
.table-wrap {
  padding: 0 32px 32px; overflow-x: auto;
}
table {
  width: 100%; border-collapse: collapse;
  font-size: 13px;
}
thead th {
  text-align: left; padding: 10px 12px;
  font-weight: 600; font-size: 11px; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border-subtle);
  white-space: nowrap;
}
tbody td {
  padding: 12px 12px;
  border-bottom: 1px solid rgba(148,163,184,0.05);
  vertical-align: middle;
}
tbody tr:hover { background: rgba(99,102,241,0.03); }
tbody tr { transition: background 0.2s; }
.amount { font-family: var(--mono); font-weight: 600; white-space: nowrap; }
.amount.pos { color: var(--accent-cyan); }
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 11px; font-weight: 600;
}
.badge.bank { background: rgba(99,102,241,0.12); color: var(--accent-indigo); }
.badge.securities { background: rgba(245,158,11,0.12); color: var(--accent-amber); }
.badge.wallet { background: rgba(52,211,153,0.12); color: var(--accent-emerald); }
.badge.other { background: rgba(148,163,184,0.08); color: var(--text-muted); }
.badge.equity { background: rgba(99,102,241,0.12); color: var(--accent-indigo); }
.badge.fixed { background: rgba(34,211,238,0.12); color: var(--accent-cyan); }
.badge.fund { background: rgba(245,158,11,0.12); color: var(--accent-amber); }
.badge.cash { background: rgba(52,211,153,0.12); color: var(--accent-emerald); }
.badge.alternative { background: rgba(167,139,250,0.12); color: var(--accent-violet); }
.badge.other-class { background: rgba(148,163,184,0.08); color: var(--text-muted); }
.source-file { font-size: 11px; color: var(--text-muted); font-family: var(--mono); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
colgroup col.amount-col { width: 120px; }
colgroup col.location-col { width: 120px; }
colgroup col.source-col { width: 180px; }
colgroup col.time-col { width: 150px; }

/* 空状态 */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--text-muted);
}
.empty-state-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
.empty-state-text { font-size: 14px; margin-bottom: 8px; }
.empty-state-hint { font-size: 12px; }

/* 加载动画 */
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
.loading-row td {
  height: 48px;
  background: linear-gradient(90deg, transparent, rgba(99,102,241,0.04), transparent);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <div class="brand-mark">VE</div>
    <span class="header-title">账户总览</span>
  </div>
  <button class="header-back" onclick="goBack()">← 返回财务中枢</button>
</div>

<!-- 统计栏 -->
<div class="stats-bar" id="statsBar">
  <div class="stat-card">
    <div class="stat-label">持仓总数</div>
    <div class="stat-value indigo" id="totalCount">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">总资产</div>
    <div class="stat-value cyan" id="totalValue">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">信息来源</div>
    <div class="stat-value emerald" id="sourceCount">—</div>
  </div>
  <div class="stat-card" style="border-left: 3px solid var(--accent-rose);">
    <div class="stat-label">权益</div>
    <div class="stat-value" id="equityValue" style="color: var(--accent-rose);">—</div>
  </div>
  <div class="stat-card" style="border-left: 3px solid var(--accent-cyan);">
    <div class="stat-label">固收</div>
    <div class="stat-value cyan" id="fixedValue">—</div>
  </div>
  <div class="stat-card" style="border-left: 3px solid var(--accent-amber);">
    <div class="stat-label">基金</div>
    <div class="stat-value" id="fundValue" style="color: var(--accent-amber);">—</div>
  </div>
  <div class="stat-card" style="border-left: 3px solid var(--accent-violet);">
    <div class="stat-label">另类</div>
    <div class="stat-value" id="altValue" style="color: var(--accent-violet);">—</div>
  </div>
</div>

<!-- 筛选栏 -->
<div style="display:flex;align-items:center;justify-content:space-between;padding:0 32px;">
  <div class="filter-bar" id="filterBar" style="flex:1;">
    <button class="filter-btn active" data-filter="all">全部</button>
    <button class="filter-btn" data-filter="bank">银行</button>
    <button class="filter-btn" data-filter="broker">证券</button>
    <button class="filter-btn" data-filter="equity">权益</button>
    <button class="filter-btn" data-filter="fixed">固收</button>
    <button class="filter-btn" data-filter="fund">基金</button>
    <button class="filter-btn" data-filter="liquid">流动</button>
    <button class="filter-btn" data-filter="protection">保障</button>
    <button class="filter-btn" data-filter="alt">另类</button>
  </div>
  <button id="btnAddHolding" onclick="ve5_showAddHoldingModal()" style="margin-left:16px;padding:6px 16px;border-radius:8px;border:1px solid var(--border-active);background:rgba(99,102,241,0.1);color:var(--accent-indigo);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all 0.2s;" onmouseover="this.style.background='rgba(99,102,241,0.2)'" onmouseout="this.style.background='rgba(99,102,241,0.1)'">+ 手动新增</button>
</div>

<!-- 表格 -->
<div class="table-wrap">
  <table id="holdingsTable">
    <colgroup>
      <col><col class="amount-col"><col class="location-col"><col><col><col class="source-col"><col class="time-col"><col style="width:80px;">
    </colgroup>
    <thead>
      <tr>
        <th>持仓名称</th>
        <th>金额 (¥)</th>
        <th>位置</th>
        <th>类型</th>
        <th>属性</th>
        <th>信息来源</th>
        <th>更新时间</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="holdingsBody">
      <tr class="loading-row"><td colspan="8"></td></tr>
      <tr class="loading-row"><td colspan="8"></td></tr>
      <tr class="loading-row"><td colspan="8"></td></tr>
    </tbody>
  </table>
</div>

<script>
const VE4_API_BASE = window.location.origin;

// 从 URL 获取 token
function getToken() {
  const m = window.location.search.match(/ve5_token=([^&]+)/);
  return m ? m[1] : null;
}
const TOKEN = getToken();

async function ve5_fetch(url, opts = {}) {
  let tsUrl = url;
  if (!url.includes('_t=')) {
    const sep = url.includes('?') ? '&' : '?';
    tsUrl = url + sep + '_t=' + Date.now();
  }
  const headers = { ...opts.headers };
  if (TOKEN && !tsUrl.endsWith('/health') && !tsUrl.includes('/pwa/')) {
    headers['x-ve5-token'] = TOKEN;
  }
  const res = await fetch(tsUrl, { ...opts, headers });
  if (res.status === 401) throw new Error('Unauthorized');
  return res;
}

function goBack() {
  window.location.href = VE4_API_BASE + '/pwa/index.html' + (TOKEN ? '?ve5_token=' + TOKEN : '');
}

// 格式化金额
function fmtAmount(v) {
  if (v == null || v === 0) return '—';
  return v.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// 类型徽章
function assetClassBadge(cls) {
  if (!cls) return '<span class="badge other-class">未分类</span>';
  const labelMap = {
    aggressive: '权益', stable: '固收', liquid: '流动',
    protection: '保障', alternative: '另类', cash: '流动',
    fixed_income: '固收', equity: '权益', unclassified: '未分类'
  };
  const classMap = {
    aggressive: 'equity', stable: 'fixed', liquid: 'cash',
    protection: 'fund', alternative: 'alternative', cash: 'cash',
    fixed_income: 'fixed', equity: 'equity'
  };
  const label = labelMap[cls] || cls;
  const clsName = classMap[cls] || 'other-class';
  return `<span class="badge ${clsName}">${label}</span>`;
}

// 位置类型徽章
function accountTypeBadge(acctType) {
  const map = {
    bank: ['bank', '银行'], broker: ['securities', '证券'], securities: ['securities', '证券'],
    fund: ['fund', '基金'], wallet: ['wallet', '钱包'], cash: ['cash', '现金'],
    other: ['other', '其他'], unknown: ['other', '未知']
  };
  const [cls, label] = map[acctType] || ['other', '其他'];
  return `<span class="badge ${cls}">${label}</span>`;
}

// 风险等级
function riskLabel(level) {
  if (!level) return '—';
  const map = { 'low': '低风险', 'medium': '中风险', 'medium_high': '中高风险', 'high': '高风险' };
  return map[level] || level;
}

// 加载数据
let allHoldings = [];
async function loadData() {
  const statsEl = document.getElementById('totalCount');
  const valueEl = document.getElementById('totalValue');
  const sourceEl = document.getElementById('sourceCount');
  const equityValueEl = document.getElementById('equityValue');
  const fixedValueEl = document.getElementById('fixedValue');
  const fundValueEl = document.getElementById('fundValue');
  const altValueEl = document.getElementById('altValue');
  const body = document.getElementById('holdingsBody');

  try {
    const r = await ve5_fetch(VE4_API_BASE + '/api/v1/account/overview');
    const data = await r.json();
    if (!data.success) throw new Error(data.error || '加载失败');

    allHoldings = data.holdings || [];
    statsEl.textContent = data.total || 0;
    valueEl.textContent = '¥' + fmtAmount(data.total_value);
    // 统计信息来源
    const sources = new Set(allHoldings.map(h => h.source_file).filter(Boolean));
    sourceEl.textContent = sources.size + ' 个文件';

    // 分类统计
    const rows = allHoldings;
    const equity = rows.filter(r => r.asset_class === 'aggressive' || r.asset_class === 'equity').reduce((s, r) => s + (r.current_value || 0), 0);
    const fixed = rows.filter(r => r.asset_class === 'stable' || r.asset_class === 'fixed_income').reduce((s, r) => s + (r.current_value || 0), 0);
    const alt = rows.filter(r => r.asset_class === 'alternative' || /商品|期权|期货|黄金|白银|Reits|可转债/i.test(r.product_name)).reduce((s, r) => s + (r.current_value || 0), 0);
    const fundVal = rows.filter(r => r.account_type === 'fund').reduce((s, r) => s + (r.current_value || 0), 0);
    if (equityValueEl) equityValueEl.textContent = '¥' + fmtAmount(equity);
    if (fixedValueEl) fixedValueEl.textContent = '¥' + fmtAmount(fixed);
    if (fundValueEl) fundValueEl.textContent = '¥' + fmtAmount(fundVal);
    if (altValueEl) altValueEl.textContent = '¥' + fmtAmount(alt);

    renderTable('all');
  } catch (e) {
    body.innerHTML = `<tr><td colspan="7"><div class="empty-state">
      <div class="empty-state-icon">📂</div>
      <div class="empty-state-text">暂无持仓数据</div>
      <div class="empty-state-hint">请通过「数据同步」上传截图或文件，AI 将自动识别持仓信息</div>
    </div></td></tr>`;
  }
}

function renderTable(filter) {
  const body = document.getElementById('holdingsBody');
  let filtered = allHoldings;
  if (filter !== 'all') {
    filtered = allHoldings.filter(h => {
      const ac = h.asset_class || '';
      const type = h.account_type || '';
      const name = h.product_name || h.name || '';
      const equity = (ac === 'aggressive' || ac === 'equity');
      const fixed = (ac === 'stable' || ac === 'fixed_income');
      const liquid = (ac === 'liquid' || ac === 'cash');
      const protection = (ac === 'protection');
      const alt = (ac === 'alternative' || /商品|期权|期货|黄金|白银|Reits|可转债/i.test(name));
      const fund = (type === 'fund');
      if (filter === 'equity') return equity;
      if (filter === 'fixed') return fixed;
      if (filter === 'liquid') return liquid;
      if (filter === 'protection') return protection;
      if (filter === 'fund') return fund;
      if (filter === 'alt') return alt;
      if (filter === 'broker') return (type === 'broker' || type === 'securities');
      return h.account_type === filter || h.asset_class === filter;
    });
  }

  if (filtered.length === 0) {
    body.innerHTML = `<tr><td colspan="8"><div class="empty-state">
      <div class="empty-state-icon">📋</div>
      <div class="empty-state-text">该分类下暂无持仓</div>
    </div></td></tr>`;
    return;
  }

  body.innerHTML = filtered.map(h => {
    const assetClass = h.asset_class || '';
    const subClass = h.sub_class || '';
    const risk = riskLabel(h.risk_level);
    const liquidity = h.liquidity_level || '';
    const attrParts = [assetClassBadge(assetClass)];
    if (risk && risk !== '—') attrParts.push(`<span style="font-size:11px;color:var(--text-muted)">${risk}</span>`);
    if (liquidity) attrParts.push(`<span style="font-size:11px;color:var(--text-muted)">${liquidity}</span>`);
    const hid = h.id || '';

    return `<tr>
      <td><strong>${h.product_name || '未命名'}</strong>${h.product_code ? '<br><span style="font-size:11px;color:var(--text-muted);font-family:var(--mono)">' + h.product_code + '</span>' : ''}</td>
      <td class="amount pos">¥${fmtAmount(h.current_value)}</td>
      <td>${accountTypeBadge(h.account_type)}<br><span style="font-size:11px;color:var(--text-secondary)">${h.account_name || '—'}</span></td>
      <td>${assetClassBadge(assetClass)}${subClass ? '<br><span style="font-size:11px;color:var(--text-muted)">' + subClass + '</span>' : ''}</td>
      <td style="font-size:11px;">${attrParts.join(' ')}</td>
      <td><span class="source-file" title="${h.source_file || ''}">${h.source_file || '—'}</span></td>
      <td style="font-size:11px;color:var(--text-secondary)">${h.source_time || h.updated_at || '—'}</td>
      <td style="white-space:nowrap;">
        <button class="ve5-h-edit-btn" data-hid="${hid}" style="padding:2px 6px;border-radius:4px;border:none;background:transparent;color:var(--accent-indigo);font-size:12px;cursor:pointer;" title="编辑">✏️</button>
        <button class="ve5-h-del-btn" data-hid="${hid}" data-hname="${(h.product_name||'').replace(/"/g,'&quot;')}" style="padding:2px 6px;border-radius:4px;border:none;background:transparent;color:var(--accent-rose);font-size:12px;cursor:pointer;" title="删除">🗑️</button>
      </td>
    </tr>`;
  }).join('');
}

// 筛选切换
document.getElementById('filterBar').addEventListener('click', function(e) {
  if (e.target.classList.contains('filter-btn')) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    renderTable(e.target.dataset.filter);
  }
});

// ─── 手动新增持仓弹窗 ───
function ve5_showAddHoldingModal(defaultAccount) {
  const acct = defaultAccount || '';
  const overlay = document.createElement('div');
  overlay.id = 've5_addHoldingOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:1002;display:flex;align-items:center;justify-content:center;';
  overlay.innerHTML = `
    <div style="background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:16px;padding:24px;max-width:440px;width:92%;max-height:90vh;overflow-y:auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div style="font-size:16px;font-weight:700;">手动新增持仓</div>
        <div style="font-size:11px;color:var(--text-muted);">信息来源：用户手动更新</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div>
          <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px;">持仓名称 <span style="color:var(--accent-rose);">*</span></label>
          <input id="ve5_hName" type="text" placeholder="例：招商银行、沪深300ETF" style="width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border-subtle);background:var(--bg-elevated);color:var(--text-primary);font-size:14px;outline:none;">
        </div>
        <div>
          <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px;">金额 (¥) <span style="color:var(--accent-rose);">*</span></label>
          <input id="ve5_hValue" type="number" step="0.01" min="0" placeholder="0.00" style="width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border-subtle);background:var(--bg-elevated);color:var(--text-primary);font-size:14px;outline:none;">
        </div>
        <div>
          <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px;">位置（账户）</label>
          <input id="ve5_hAccount" type="text" value="${acct}" placeholder="例：银行/招商银行、证券/证券账户" style="width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border-subtle);background:var(--bg-elevated);color:var(--text-primary);font-size:14px;outline:none;">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div>
            <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px;">资产类型</label>
            <select id="ve5_hAssetClass" style="width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border-subtle);background:var(--bg-elevated);color:var(--text-primary);font-size:14px;outline:none;">
              <option value="aggressive">进取/权益</option>
              <option value="stable">稳健/固收</option>
              <option value="liquid">流动</option>
              <option value="protection">保障</option>
            </select>
          </div>
          <div>
            <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px;">产品代码</label>
            <input id="ve5_hCode" type="text" placeholder="选填，如 601398" style="width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border-subtle);background:var(--bg-elevated);color:var(--text-primary);font-size:14px;outline:none;">
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div>
            <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px;">数量/份额</label>
            <input id="ve5_hQty" type="number" step="0.01" placeholder="选填" style="width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border-subtle);background:var(--bg-elevated);color:var(--text-primary);font-size:14px;outline:none;">
          </div>
          <div>
            <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px;">成本</label>
            <input id="ve5_hCost" type="number" step="0.01" placeholder="选填" style="width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border-subtle);background:var(--bg-elevated);color:var(--text-primary);font-size:14px;outline:none;">
          </div>
        </div>
        <div style="display:flex;gap:10px;margin-top:4px;">
          <button id="ve5_hSubmit" onclick="ve5_doAddHolding()" style="flex:1;padding:10px;border-radius:8px;border:none;background:var(--accent-indigo);color:#fff;font-size:14px;font-weight:600;cursor:pointer;">确认新增</button>
          <button onclick="document.getElementById('ve5_addHoldingOverlay').remove()" style="flex:1;padding:10px;border-radius:8px;border:none;background:var(--bg-elevated);color:var(--text-secondary);font-size:14px;cursor:pointer;">取消</button>
        </div>
      </div>
    </div>`;
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  document.getElementById('ve5_hName').focus();
}

async function ve5_doAddHolding() {
  const name = document.getElementById('ve5_hName').value.trim();
  const value = parseFloat(document.getElementById('ve5_hValue').value);
  const account = document.getElementById('ve5_hAccount').value.trim();
  const asset_class = document.getElementById('ve5_hAssetClass').value;
  const code = document.getElementById('ve5_hCode').value.trim();
  const qty = parseFloat(document.getElementById('ve5_hQty').value) || 0;
  const cost = parseFloat(document.getElementById('ve5_hCost').value) || 0;

  if (!name) { alert('请输入持仓名称'); return; }
  if (!value || value <= 0) { alert('请输入有效金额'); return; }

  const btn = document.getElementById('ve5_hSubmit');
  btn.disabled = true; btn.textContent = '提交中...';

  try {
    const r = await ve5_fetch(VE4_API_BASE + '/api/v1/holdings?_t=' + Date.now(), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        product_name: name,
        current_value: value,
        account_key: account,
        asset_class: asset_class,
        product_code: code,
        quantity: qty,
        cost_basis: cost
      })
    });
    const data = await r.json();
    if (data.status === 'ok') {
      document.getElementById('ve5_addHoldingOverlay').remove();
      loadData(); // 刷新表格
    } else {
      alert('新增失败: ' + (data.message || '未知错误'));
      btn.disabled = false; btn.textContent = '确认新增';
    }
  } catch(e) {
    alert('请求失败: ' + e.message);
    btn.disabled = false; btn.textContent = '确认新增';
  }
}

// ─── URL 参数检测（从 index.html 跳转过来时自动弹窗） ───
(function() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('action') === 'add_holding') {
    const acct = params.get('account') || '';
    // 等页面加载完再弹窗
    setTimeout(() => ve5_showAddHoldingModal(acct), 300);
  }
})();

// ─── 编辑持仓弹窗（从 DOM 行读取数据） ───
function ve5_editHoldingById(hid) {
  const row = document.querySelector(`.ve5-h-edit-btn[data-hid="${hid}"]`);
  const tr = row ? row.closest('tr') : null;
  if (!tr) return;
  const cells = tr.querySelectorAll('td');
  const name = cells[0] ? cells[0].textContent.trim() : '';
  const valText = cells[1] ? cells[1].textContent.replace(/[¥,]/g, '').trim() : '0';
  const acct = cells[2] ? cells[2].textContent.trim().replace(/[\n\r]/g, ' ') : '';

  const h = {
    id: hid, product_name: name, current_value: parseFloat(valText) || 0,
    account_key: acct, asset_class: 'aggressive', product_code: ''
  };
  ve5_editHolding(h);
}

function ve5_editHolding(h) {
  const overlay = document.createElement('div');
  overlay.id = 've5_editHoldingOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:1002;display:flex;align-items:center;justify-content:center;';
  overlay.innerHTML = `
    <div style="background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:16px;padding:24px;max-width:440px;width:92%;">
      <div style="font-size:16px;font-weight:700;margin-bottom:16px;">编辑持仓</div>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div>
          <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px;">持仓名称</label>
          <input id="ve5_ehName" type="text" value="${(h.product_name||'').replace(/"/g,'&quot;')}" style="width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border-subtle);background:var(--bg-elevated);color:var(--text-primary);font-size:14px;outline:none;">
        </div>
        <div>
          <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px;">金额 (¥)</label>
          <input id="ve5_ehValue" type="number" step="0.01" value="${h.current_value||0}" style="width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border-subtle);background:var(--bg-elevated);color:var(--text-primary);font-size:14px;outline:none;">
        </div>
        <div>
          <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px;">位置（账户）</label>
          <input id="ve5_ehAccount" type="text" value="${(h.account_key||'').replace(/"/g,'&quot;')}" style="width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border-subtle);background:var(--bg-elevated);color:var(--text-primary);font-size:14px;outline:none;">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div>
            <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px;">资产类型</label>
            <select id="ve5_ehAssetClass" style="width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border-subtle);background:var(--bg-elevated);color:var(--text-primary);font-size:14px;outline:none;">
              <option value="aggressive" ${h.asset_class==='aggressive'?'selected':''}>进取/权益</option>
              <option value="stable" ${h.asset_class==='stable'?'selected':''}>稳健/固收</option>
              <option value="liquid" ${h.asset_class==='liquid'?'selected':''}>流动</option>
              <option value="protection" ${h.asset_class==='protection'?'selected':''}>保障</option>
              <option value="alternative" ${h.asset_class==='alternative'?'selected':''}>另类</option>
            </select>
          </div>
          <div>
            <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px;">产品代码</label>
            <input id="ve5_ehCode" type="text" value="${(h.product_code||'').replace(/"/g,'&quot;')}" style="width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border-subtle);background:var(--bg-elevated);color:var(--text-primary);font-size:14px;outline:none;">
          </div>
        </div>
        <div style="display:flex;gap:10px;margin-top:4px;">
          <button id="ve5_ehSubmit" onclick="ve5_doEditHolding(${h.id})" style="flex:1;padding:10px;border-radius:8px;border:none;background:var(--accent-indigo);color:#fff;font-size:14px;font-weight:600;cursor:pointer;">保存修改</button>
          <button onclick="document.getElementById('ve5_editHoldingOverlay').remove()" style="flex:1;padding:10px;border-radius:8px;border:none;background:var(--bg-elevated);color:var(--text-secondary);font-size:14px;cursor:pointer;">取消</button>
        </div>
      </div>
    </div>`;
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

async function ve5_doEditHolding(holdingId) {
  const name = document.getElementById('ve5_ehName').value.trim();
  const value = parseFloat(document.getElementById('ve5_ehValue').value);
  const account = document.getElementById('ve5_ehAccount').value.trim();
  const asset_class = document.getElementById('ve5_ehAssetClass').value;
  const code = document.getElementById('ve5_ehCode').value.trim();

  if (!name) { alert('请输入持仓名称'); return; }
  if (!value || value < 0) { alert('请输入有效金额'); return; }

  const btn = document.getElementById('ve5_ehSubmit');
  btn.disabled = true; btn.textContent = '保存中...';

  try {
    const r = await ve5_fetch(VE4_API_BASE + '/api/v1/holdings/' + holdingId + '?_t=' + Date.now(), {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        product_name: name, current_value: value, account_key: account,
        asset_class: asset_class, product_code: code
      })
    });
    const data = await r.json();
    if (data.status === 'ok') {
      document.getElementById('ve5_editHoldingOverlay').remove();
      alert('修改成功！' + (data.diff ? `差额 ¥${data.diff.toLocaleString()} 已生成自定义项` : ''));
      loadData();
    } else {
      alert('修改失败: ' + (data.message || '未知错误'));
      btn.disabled = false; btn.textContent = '保存修改';
    }
  } catch(e) {
    alert('请求失败: ' + e.message);
    btn.disabled = false; btn.textContent = '保存修改';
  }
}

async function ve5_deleteHolding(holdingId, productName) {
  if (!confirm(`确定要删除持仓「${productName || ''}」吗？\n此操作不可恢复。`)) return;
  try {
    const r = await ve5_fetch(VE4_API_BASE + '/api/v1/holdings/' + holdingId + '?_t=' + Date.now(), {method: 'DELETE'});
    const data = await r.json();
    if (data.status === 'ok') {
      loadData();
    } else {
      alert('删除失败: ' + (data.message || '未知错误'));
    }
  } catch(e) {
    alert('请求失败: ' + e.message);
  }
}

// 加载
loadData();

// ─── 支持 URL 参数 ?filter=equity 自动切换筛选 ───
(function() {
  const params = new URLSearchParams(window.location.search);
  const f = params.get('filter');
  if (f) {
    const btn = document.querySelector(`.filter-btn[data-filter="${f}"]`);
    if (btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTable(f);
    }
  }
})();

window.addEventListener('load', () => {
  // ─── 全局防缓存：拦截所有页面内 <a> 跳转，自动附加时间戳 ───
  document.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    if (href && href.endsWith('.html') && !href.includes('_t=')) {
      a.addEventListener('click', function(e) {
        e.preventDefault();
        const sep = href.includes('?') ? '&' : '?';
        window.location.href = href + sep + '_t=' + Date.now();
      });
    }
  });

  // ─── 事件委托：持仓编辑/删除按钮 ───
  document.addEventListener('click', function(e) {
    const editBtn = e.target.closest('.ve5-h-edit-btn');
    if (editBtn) { ve5_editHoldingById(parseInt(editBtn.dataset.hid)); return; }
    const delBtn = e.target.closest('.ve5-h-del-btn');
    if (delBtn) { ve5_deleteHolding(parseInt(delBtn.dataset.hid), delBtn.dataset.hname || ''); }
  });
});
</script>
</body>
</html>
